<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coast to Coast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="wrap hero-inner">
      <div>
        <h1 id="title"></h1>
        <p id="subtitle" class="subtitle"></p>
      </div>
      <div class="hero-tools">
        <div class="units" role="group" aria-label="Units">
          <button data-units="mi">mi</button><button data-units="km">km</button>
        </div>
        <button id="gpx-all" class="btn ghost">Full trip GPX</button>
      </div>
    </div>
    <div class="wrap"><dl id="stats" class="stats"></dl></div>
  </header>

  <main class="wrap">
    <section class="overview card">
      <div id="overview-map" class="map map-overview" aria-label="Full route map"></div>
      <div id="legend" class="legend"></div>
    </section>

    <nav class="daybar" aria-label="Day selector">
      <button id="prev" class="nav-btn" aria-label="Previous day">‹</button>
      <div id="days" class="days"></div>
      <button id="next" class="nav-btn" aria-label="Next day">›</button>
    </nav>

    <section id="day" class="day"></section>

    <section class="trip-notes card" id="trip-notes"></section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-prev" aria-label="Previous image">‹</button>
    <figure><img alt="" /><figcaption></figcaption></figure>
    <button class="lb-next" aria-label="Next image">›</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/trip.js"></script>
  <script src="data/routes.js" onerror="window.ROUTES={}"></script>
  <script src="data/gallery.js" onerror="window.GALLERY={}"></script>
  <script src="app.js"></script>
</body>
</html>
