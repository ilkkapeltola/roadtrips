<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Road Trips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1>Motorcycle Road Trips</h1>
      <p class="subtitle">Plans in progress. Pick one to see the route, day by day.</p>
    </div>
  </header>
  <main class="wrap"><div id="trips" class="trip-list"></div></main>

  <!-- Generated by tools/build.mjs from trips/*/trip.js -->
  <script src="trips/manifest.js"></script>
  <script>
    (function () {
      // Old single-trip links (…/#day-12) pointed at the USA trip.
      if (/^#day-\d+$/.test(location.hash)) location.replace("trip.html?t=usa-coast-to-coast" + location.hash);

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fmtDate = (iso, opts) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", opts);
      const trips = window.TRIPS || [];
      document.getElementById("trips").innerHTML = trips.length
        ? trips
            .map((t) => {
              const dist = t.units === "km" ? `${Math.round(t.distanceKm).toLocaleString()} km` : `${Math.round(t.distanceKm / 1.609344).toLocaleString()} mi`;
              return `<a class="trip-card card" href="trip.html?t=${encodeURIComponent(t.slug)}">
                <div class="cover" style="background-image:url('${esc(t.cover || "")}')"></div>
                <div class="body">
                  <h2>${esc(t.title)}</h2>
                  <p>${esc(t.subtitle)}</p>
                  <div class="route">${esc(t.from)} → ${esc(t.to)}</div>
                  <div class="facts">
                    <span class="badge accent">${t.days} days</span>
                    <span class="badge">${t.ridingDays} riding days</span>
                    <span class="badge">${dist}</span>
                    <span class="badge">${fmtDate(t.startDate, { month: "short", year: "numeric" })}</span>
                  </div>
                </div>
              </a>`;
            })
            .join("")
        : `<p class="muted">No trips yet — run <code>node tools/build.mjs</code>.</p>`;
    })();
  </script>
</body>
</html>
